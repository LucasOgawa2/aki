# Builds and runs the checks on every push to main, every pull request (and by hand).
name: CI
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/check-translations.py"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:
# Read-only token: checks never write to the repository.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Build and checks
    # macOS 26 SDK: the bar and settings use Liquid Glass.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Pinned to a commit so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Translations
        run: python3 scripts/check-translations.py
      - name: Build
        run: swift build
      - name: Checks
        run: swift run AkiChecks
  linux:
    name: Build and checks (Linux)
    # The core and the command line only: the app is macOS's.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Swift's official image, pinned to a digest so a moved tag can't change what runs here.
    container: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checks ask lsof which address the server listens on; ps lists the agents.
      - name: Tools
        run: apt-get update && apt-get install -y --no-install-recommends lsof procps
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Verify clean working tree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: Checks
        run: swift run AkiChecks
